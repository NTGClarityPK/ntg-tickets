name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Determine Environment
        id: env
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "environment=production" >> $GITHUB_OUTPUT
            echo "frontend_port=8080" >> $GITHUB_OUTPUT
            echo "backend_port=4000" >> $GITHUB_OUTPUT
          else
            echo "environment=staging" >> $GITHUB_OUTPUT
            echo "frontend_port=7000" >> $GITHUB_OUTPUT
            echo "backend_port=7001" >> $GITHUB_OUTPUT
          fi

      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Test SSH Connection
        run: |
          ssh -o StrictHostKeyChecking=no dev@192.168.50.50 'echo "Connected successfully"'

      - name: Deploy
        run: |
          cd /home/dev/ntgticketv2/ntg-tickets/project
          
          # Pull latest code
          git config pull.rebase false
          git pull origin ${{ github.ref_name }} || echo "Already up to date"
          
          # Deploy based on environment
          if [ "${{ steps.env.outputs.environment }}" = "production" ]; then
            docker-compose down || true
            docker-compose up -d --build
          else
            docker-compose -f docker-compose-staging.yml down || true
            docker-compose -f docker-compose-staging.yml up -d --build
          fi
