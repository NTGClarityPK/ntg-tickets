name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Determine Environment
        id: env
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "environment=production" >> $GITHUB_OUTPUT
            echo "frontend_port=8080" >> $GITHUB_OUTPUT
            echo "backend_port=4000" >> $GITHUB_OUTPUT
          else
            echo "environment=staging" >> $GITHUB_OUTPUT
            echo "frontend_port=7000" >> $GITHUB_OUTPUT
            echo "backend_port=7001" >> $GITHUB_OUTPUT
          fi

      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Test SSH Connection
        run: |
          ssh -o StrictHostKeyChecking=no dev@192.168.50.50 'echo "Connected successfully"'

      - name: Deploy to Server
        run: |
          ssh dev@192.168.50.50 << 'ENDSSH'
            cd /home/dev/ntgticketv2/ntg-tickets/project
            bash /home/dev/deployments/scripts/deploy.sh ${{ steps.env.outputs.environment }} ${{ github.sha }}
          ENDSSH
